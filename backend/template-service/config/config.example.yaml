# Copy to config.yaml for local dev (`make config-init` does this).
# Never commit real credentials — use env var interpolation (viper's
# AutomaticEnv + BindEnv) for anything secret, even in config.yaml.
server:
  host: "0.0.0.0"
  port: "TODO-service-port"
  service_id: "TODO-service-name"
  read_timeout: "30s"
  write_timeout: "30s"

logger:
  level: "debug" # debug | info | warn | error
  encoding: "console" # console (dev) | json (prod)

