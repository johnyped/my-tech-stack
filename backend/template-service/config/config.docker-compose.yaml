# Used by `make run-docker` / docker-compose.yaml. Hostnames match the
# service names in docker-compose.yaml, not "localhost" — uncomment the
# blocks matching whatever you enabled there.
server:
  host: "0.0.0.0"
  port: "8080"
  service_id: "TODO-service-name"
  read_timeout: "30s"
  write_timeout: "30s"

logger:
  level: "debug"
  encoding: "console"

