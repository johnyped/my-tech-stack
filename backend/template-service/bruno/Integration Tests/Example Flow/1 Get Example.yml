info:
  name: 1 Get Example
  type: http
  seq: 1
http:
  method: GET
  url: "{{base_url}}/v1/examples/{{example_id}}"
  body:
    type: none
  auth: inherit
runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("ex_example_id", "example-123");
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
  - name: Success
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "status": "Success",
            "service_id": "TODO-service-name",
            "message": "OK",
            "data": { "id": "example-123", "name": "Example" }
          }
