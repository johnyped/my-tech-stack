info:
  name: Ping
  type: http
  seq: 3
http:
  method: GET
  url: "{{base_url}}/ping"
  body:
    type: none
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    response:
      status: 200
      statusText: OK
      headers: []
      body:
        type: text
        data: ""

docs: |-
  ## Purpose

  Trivial reachability check — no dependency checks, no JSON body. Useful
  for load balancer health checks that just want a 200.

  ## Request

  ### Endpoint
  `GET /ping`

  ## Response

  ### HTTP Status: 200

  Empty body.

  ## Dependencies

  None.
