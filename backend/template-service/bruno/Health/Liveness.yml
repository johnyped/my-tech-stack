info:
  name: Liveness
  type: http
  seq: 1
http:
  method: GET
  url: "{{base_url}}/health/liveness"
  body:
    type: none
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("status is ALIVE", function() {
          expect(res.getBody().status).to.equal("ALIVE");
        });

        test("service_id is a string", function() {
          expect(res.getBody().service_id).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "status": "ALIVE",
            "service_id": "TODO-service-name"
          }

docs: |-
  ## Purpose

  Liveness probe. Returns `200` with a static `ALIVE` status as long as the
  process is running — never checks dependencies. Used by Docker
  `HEALTHCHECK` and the k8s liveness probe.

  ## Request

  ### Endpoint
  `GET /health/liveness`

  No parameters, no body, no auth.

  ## Response

  ### HTTP Status: 200

  #### Body (JSON)

  | Field Name | Type | Mandatory | Description | Possible Value |
  |---|---|---|---|---|
  | status | String | Yes | Liveness status. Always static. | `ALIVE` |
  | service_id | String | Yes | From config `server.service_id`. | `TODO-service-name` |

  ## Dependencies

  None.
