info:
  name: Get Example
  type: http
  seq: 1
http:
  method: GET
  url: "{{base_url}}/v1/examples/{{example_id}}"
  body:
    type: none
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response has NEO envelope fields", function() {
          const body = res.getBody();
          expect(body).to.have.property("status");
          expect(body).to.have.property("service_id");
          expect(body).to.have.property("message");
          expect(body).to.have.property("data");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "status": "Success",
            "service_id": "TODO-service-name",
            "message": "OK",
            "data": {
              "id": "example-123",
              "name": "Example"
            }
          }
  - name: Not Found
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "status": "Error",
            "service_id": "TODO-service-name",
            "message": "example not found",
            "data": null
          }

