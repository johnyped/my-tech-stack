  #     timeout: 5s
  #     retries: 3
  # <<< STORAGE

  # --- Event streaming — enable if your service produces/consumes Kafka topics
  # (checklist: --kafka yes). KRaft mode, no Zookeeper. ---
  # >>> KAFKA
  # kafka:
  #   image: apache/kafka:4.1.0
