  # --- HTTP downstream mocking — enable only if your service calls another
  # HTTP service AND needs more than one response shape across test scenarios
  # (checklist: --mockoon yes; see document/MOCKING_GUIDE.md §2 decision rule) ---
  # >>> MOCKOON
  # mockoon:
  #   image: mockoon/cli:latest
  #   command: ["--data", "/data/scenario.json", "--port", "3000"]
  #   volumes:
  #     - ./test/integration/mockoon:/data:ro
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - service-network
  # <<< MOCKOON

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  minio-data:
    driver: local
  kafka-data:
    driver: local

networks:
  service-network:
    driver: bridge
