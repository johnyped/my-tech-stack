# Full local stack. Every optional block below is commented out — uncomment
# only what your service's checklist answer says you need (see
# document/SCAFFOLD_CHECKLIST.md). `script/new-service.sh` does this
# uncommenting for you automatically based on your --cache/--db/--kafka/
# --storage/--mockoon flags; this file is the hand-edit fallback.
services:
  TODO-service-name:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: TODO-service-name
    ports:
      - "8080:8080"
    environment:
      - CONFIG_FILE=/app/config/config.docker-compose.yaml
    volumes:
      - ./config/config.docker-compose.yaml:/app/config/config.docker-compose.yaml:ro
    networks:
      - service-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/liveness"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Uncomment per enabled infra block below:
    # depends_on:
    #   redis:
    #     condition: service_healthy
    #   postgres:
    #     condition: service_healthy
    #   kafka:
    #     condition: service_healthy

  # --- Cache / session store — enable if your service needs Redis/Valkey session,
  # rate-limit, or distributed-lock state (checklist: --cache redis|valkey) ---
