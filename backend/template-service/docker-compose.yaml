  #     timeout: 3s
  #     retries: 5
  # <<< DB

  # --- Object storage — enable if your service reads/writes S3 objects
  # (checklist: --storage s3); MinIO is the local S3-compatible stand-in ---
  # >>> STORAGE
  # minio:
  #   image: minio/minio:latest
