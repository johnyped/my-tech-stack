  # redis:
  #   image: redis:7-alpine
  #   command: redis-server --requirepass password --appendonly yes
  #   ports:
  #     - "${REDIS_PORT:-6379}:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - service-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5
  #   restart: unless-stopped
  # <<< CACHE

  # --- Relational DB — enable if your service persists data to Postgres
